<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue Tchipa</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <header class="sticky top-0 z-10 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row sm:items-center gap-3">
      <div class="flex items-baseline gap-2 shrink-0">
        <h1 class="text-lg font-bold tracking-tight">Catalogue</h1>
        <span id="count" class="text-sm text-slate-500"></span>
      </div>
      <input id="search" type="search" autocomplete="off"
             placeholder="Rechercher un article…"
             aria-label="Rechercher un article"
             class="w-full sm:flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm
                    focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600">
      <label class="shrink-0 cursor-pointer text-sm text-emerald-700 hover:text-emerald-800 font-medium">
        Charger un CSV
        <input id="file" type="file" accept=".csv,text/csv" class="hidden">
      </label>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <p id="status" class="text-center text-slate-500 py-16">Chargement du catalogue…</p>
    <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
  </main>

  <template id="card-tpl">
    <article class="flex flex-col bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-shadow">
      <div class="aspect-square bg-slate-100 flex items-center justify-center text-xs text-slate-400">
        <img class="w-full h-full object-cover" loading="lazy" alt="">
      </div>
      <div class="flex flex-col flex-1 p-3 gap-2">
        <h2 class="text-sm font-medium leading-snug line-clamp-2" data-title></h2>
        <p class="mt-auto text-lg font-bold text-emerald-700 tabular-nums" data-price></p>
        <a data-link target="_blank" rel="noopener noreferrer"
           class="block text-center rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-2 transition-colors">
          Voir le produit
        </a>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
