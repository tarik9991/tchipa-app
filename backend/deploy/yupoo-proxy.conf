# Yupoo photo relay for tchipa.co.uk/tchipa2/ (website catalogue).
#
# photo.yupoo.com answers HTTP 567 unless the Referer is the store's own
# x.yupoo.com page, which a browser can never send. nginx fetches the photo
# with the right Referer and caches it.
#
# Only /yupoo/<store>/<hash>/(small|medium).jpg is relayed — not an open proxy.
#
# Path on VPS: /etc/nginx/snippets/yupoo-proxy.conf, included inside the
# 443 server block of tchipa-api.conf (setup-yupoo-proxy.sh does it).

location ~ ^/yupoo/([a-z0-9-]+)/([0-9a-f]+)/(small|medium)\.jpg$ {
    # ipv6=off: the VPS has no IPv6 route, and an AAAA answer made some
    # requests hang until the browser gave up (empty thumbnails).
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    proxy_pass https://photo.yupoo.com/$1/$2/$3.jpg;
    proxy_ssl_server_name on;
    proxy_set_header Host    photo.yupoo.com;
    proxy_set_header Referer https://$1.x.yupoo.com/;
    proxy_set_header Cookie  "";
    proxy_hide_header Set-Cookie;

    proxy_cache yupoo;
    proxy_cache_valid 200 30d;
    proxy_cache_valid any 1m;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;

    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Access-Control-Allow-Origin "*";
    add_header X-Cache $upstream_cache_status;
}
