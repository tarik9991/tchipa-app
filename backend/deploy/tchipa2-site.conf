# Static vitrine for Tchipa 2 at tchipa2.tchipa.co.uk (moved off tchipa.co.uk/tchipa2/
# on 2026-11-26). Files: /var/www/tchipa2-site (pushed by tchipa2/tools/deploy_site.sh).
# Photos stay on api.tchipa.co.uk/t2 and /yupoo. certbot --nginx adds the 443 block.
#
# Path on VPS: /etc/nginx/sites-available/tchipa2-site.conf (symlinked in sites-enabled).
server {
    listen 80;
    listen [::]:80;
    server_name tchipa2.tchipa.co.uk;

    root /var/www/tchipa2-site;
    index index.html;

    location = /products.json {
        add_header Cache-Control "public, max-age=300";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
