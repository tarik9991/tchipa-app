# Tchipa 2 photos stored on the VPS (built by tchipa2/tools/vps_photos.cjs):
#   /t2/<store>/<albumId>/s.webp      400 px cover (grid)
#   /t2/<store>/<albumId>/<n>.webp    full photo (detail, up to 1200 px)
# Served straight from disk: no dependency on Yupoo once scraped. Only that
# exact pattern is served (manifest.json and anything else → 404).
#
# Path on VPS: /etc/nginx/snippets/t2-photos.conf, included inside the
# 443 server block of tchipa-api.conf (setup-t2-photos.sh does it).

location ~ ^/t2/([a-z0-9-]+)/(\d+)/(s|\d+)\.webp$ {
    alias /var/www/tchipa2-photos/$1/$2/$3.webp;
    default_type image/webp;
    add_header Cache-Control "public, max-age=2592000";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
}
