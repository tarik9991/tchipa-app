name: tchipa2
description: "Tchipa 2 — boutique"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/tchipa_logo.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/tchipa_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/tchipa_logo.png
    - assets/catalog/products.json
